<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">File input and output</title><desc id="desc">Persistent file bytes are parsed into in-memory Python objects and can later be serialized back to files.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">File I/O separates persistent bytes from in-memory objects</text><rect x="80" y="180" width="240" height="160" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="200.0" y="216" text-anchor="middle" class="lab">File on disk</text><text x="200.0" y="245" text-anchor="middle" class="sm">CSV / JSON / text</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="335" y1="260" x2="500" y2="260" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="515" y="180" width="240" height="160" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="635.0" y="216" text-anchor="middle" class="lab">Parser / decoder</text><text x="635.0" y="245" text-anchor="middle" class="sm">read + interpret</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="770" y1="260" x2="935" y2="260" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="950" y="180" width="170" height="160" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="1035.0" y="216" text-anchor="middle" class="lab">Python object</text><text x="1035.0" y="245" text-anchor="middle" class="sm">list / dict / table</text><text x="70" y="485" class="sm">Encoding, delimiters, schema and path assumptions must agree with the file that is actually being read.</text></svg>