<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Statistical data types</title><desc id="desc">An observed variable is classified as categorical or quantitative, with subtypes that determine valid analysis.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Data types determine what comparisons and summaries are meaningful</text><rect x="465" y="120" width="270" height="85" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="600.0" y="156" text-anchor="middle" class="lab">Observed variable</text><text x="600.0" y="185" text-anchor="middle" class="sm">what does one value mean?</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="520" y1="210" x2="300" y2="310" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="680" y1="210" x2="900" y2="310" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="170" y="325" width="270" height="100" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="305.0" y="361" text-anchor="middle" class="lab">Categorical</text><text x="305.0" y="390" text-anchor="middle" class="sm">nominal / ordinal</text><rect x="760" y="325" width="270" height="100" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="895.0" y="361" text-anchor="middle" class="lab">Quantitative</text><text x="895.0" y="390" text-anchor="middle" class="sm">discrete / continuous</text><text x="95" y="500" class="sm">Measurement scale constrains valid arithmetic, summaries, plots and statistical methods.</text></svg>