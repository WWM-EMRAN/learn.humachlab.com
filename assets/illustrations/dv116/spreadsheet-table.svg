<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Excel structured tables</title><desc id="desc">A structured table uses named columns and calculated columns that expand when rows are added.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Structured table references expand with the data</text><rect x="90" y="160" width="170" height="54" fill="#e9efff" stroke="#c8d1df"/><rect x="280" y="160" width="170" height="54" fill="#e9efff" stroke="#c8d1df"/><rect x="470" y="160" width="170" height="54" fill="#e9efff" stroke="#c8d1df"/><rect x="90" y="230" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><rect x="280" y="230" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><rect x="470" y="230" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><rect x="90" y="300" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><rect x="280" y="300" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><rect x="470" y="300" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><rect x="90" y="370" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><rect x="280" y="370" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><rect x="470" y="370" width="170" height="54" fill="#ffffff" stroke="#c8d1df"/><text x="175" y="194" text-anchor="middle" class="lab">Product</text><text x="365" y="194" text-anchor="middle" class="lab">Units</text><text x="555" y="194" text-anchor="middle" class="lab">Revenue</text><text x="175" y="265" text-anchor="middle" class="s">A</text><text x="365" y="265" text-anchor="middle" class="s">4</text><text x="555" y="265" text-anchor="middle" class="s">=Units×Price</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="680" y1="305" x2="870" y2="305" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="890" y="220" width="230" height="170" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="1005.0" y="256" text-anchor="middle" class="lab">Calculated column</text><text x="1005.0" y="285" text-anchor="middle" class="sm">formula fills automatically</text><text x="90" y="510" class="sm">Structured references use column names, making formulas easier to audit and safer when rows are added.</text></svg>