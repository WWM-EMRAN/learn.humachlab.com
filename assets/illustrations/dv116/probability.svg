<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Bayesian update</title><desc id="desc">A prior distribution is combined with a likelihood from evidence to form a posterior distribution.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Bayesian updating: prior belief + evidence → posterior belief</text><rect x="90" y="190" width="240" height="130" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="210.0" y="226" text-anchor="middle" class="lab">Prior</text><text x="210.0" y="255" text-anchor="middle" class="sm">belief before data</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="340" y1="255" x2="470" y2="255" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="485" y="190" width="240" height="130" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="605.0" y="226" text-anchor="middle" class="lab">Likelihood</text><text x="605.0" y="255" text-anchor="middle" class="sm">evidence model</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="735" y1="255" x2="865" y2="255" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="880" y="190" width="240" height="130" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="1000.0" y="226" text-anchor="middle" class="lab">Posterior</text><text x="1000.0" y="255" text-anchor="middle" class="sm">updated belief</text><text x="70" y="455" class="sm">The posterior changes only to the extent that the observed evidence is plausible under competing hypotheses.</text></svg>