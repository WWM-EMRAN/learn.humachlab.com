<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Gradient descent</title><desc id="desc">Parameter updates move along a loss curve toward a lower-loss region.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Gradient descent follows the loss surface downhill</text><path d="M 120 170 Q 340 520 600 350 Q 850 180 1090 430" fill="none" stroke="#172033" stroke-width="5"/><circle cx="200" cy="290" r="13" fill="#2446a8"/><text x="218" y="280" class="sm">θ0</text><circle cx="320" cy="390" r="13" fill="#2446a8"/><text x="338" y="380" class="sm">θ1</text><circle cx="450" cy="415" r="13" fill="#2446a8"/><text x="468" y="405" class="sm">θ2</text><circle cx="560" cy="370" r="13" fill="#2446a8"/><text x="578" y="360" class="sm">θ3</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="210" y1="295" x2="308" y2="385" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="330" y1="395" x2="438" y2="410" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="460" y1="420" x2="548" y2="365" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><text x="70" y="530" class="sm">The learning rate controls step size; too large can overshoot, too small can converge slowly.</text></svg>