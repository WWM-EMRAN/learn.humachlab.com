<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Missing data handling</title><desc id="desc">Missing values are identified, handled with a deliberate strategy, and then the transformed data are checked for distortion.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Missing data changes the observed table</text><rect x="90" y="160" width="330" height="270" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="255.0" y="196" text-anchor="middle" class="lab">Observed data</text><text x="255.0" y="225" text-anchor="middle" class="sm">values + gaps</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="435" y1="295" x2="585" y2="295" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="600" y="160" width="250" height="270" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="725.0" y="196" text-anchor="middle" class="lab">Strategy</text><text x="725.0" y="225" text-anchor="middle" class="sm">delete / fill / model</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="865" y1="295" x2="1010" y2="295" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="1020" y="160" width="110" height="270" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="1075.0" y="196" text-anchor="middle" class="lab">Result</text><text x="1075.0" y="225" text-anchor="middle" class="sm">check</text><text x="120" y="270" class="s">18   —   22</text><text x="120" y="325" class="s">20   24   —</text><text x="120" y="380" class="s">—    21   23</text><text x="70" y="515" class="sm">The method is not neutral: it can change distributions, uncertainty, relationships and the number of usable rows.</text></svg>