<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Correlation and scatter plots</title><desc id="desc">Two scatter plots show that a correlation coefficient should be interpreted alongside the data pattern.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Correlation summarises association; the scatter still matters</text><line x1="100" y1="450" x2="530" y2="450" stroke="#172033" stroke-width="3"/><line x1="100" y1="450" x2="100" y2="130" stroke="#172033" stroke-width="3"/><circle cx="140" cy="410" r="9" fill="#2446a8"/><circle cx="190" cy="390" r="9" fill="#2446a8"/><circle cx="250" cy="355" r="9" fill="#2446a8"/><circle cx="310" cy="320" r="9" fill="#2446a8"/><circle cx="380" cy="270" r="9" fill="#2446a8"/><circle cx="450" cy="220" r="9" fill="#2446a8"/><circle cx="500" cy="180" r="9" fill="#2446a8"/><text x="200" y="510" class="sm">strong positive association</text><line x1="670" y1="450" x2="1100" y2="450" stroke="#172033" stroke-width="3"/><line x1="670" y1="450" x2="670" y2="130" stroke="#172033" stroke-width="3"/><circle cx="710" cy="320" r="9" fill="#b85c18"/><circle cx="770" cy="210" r="9" fill="#b85c18"/><circle cx="830" cy="170" r="9" fill="#b85c18"/><circle cx="890" cy="210" r="9" fill="#b85c18"/><circle cx="950" cy="320" r="9" fill="#b85c18"/><circle cx="1010" cy="400" r="9" fill="#b85c18"/><circle cx="1070" cy="370" r="9" fill="#b85c18"/><text x="760" y="510" class="sm">nonlinear pattern can hide behind small r</text></svg>