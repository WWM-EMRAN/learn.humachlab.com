<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Confusion matrix</title><desc id="desc">Predicted and actual classes form true-positive, false-negative, false-positive and true-negative cells.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Confusion matrix: compare predicted and actual classes</text><rect x="330" y="180" width="250" height="130" rx="14" fill="#267a4b18" stroke="#267a4b" stroke-width="3"/><text x="455" y="250" text-anchor="middle" class="lab">True positive</text><rect x="660" y="180" width="250" height="130" rx="14" fill="#a7353518" stroke="#a73535" stroke-width="3"/><text x="785" y="250" text-anchor="middle" class="lab">False negative</text><rect x="330" y="350" width="250" height="130" rx="14" fill="#a7353518" stroke="#a73535" stroke-width="3"/><text x="455" y="420" text-anchor="middle" class="lab">False positive</text><rect x="660" y="350" width="250" height="130" rx="14" fill="#267a4b18" stroke="#267a4b" stroke-width="3"/><text x="785" y="420" text-anchor="middle" class="lab">True negative</text><text x="175" y="255" class="s">Actual positive</text><text x="175" y="425" class="s">Actual negative</text><text x="400" y="145" class="s">Predicted positive</text><text x="725" y="145" class="s">Predicted negative</text></svg>