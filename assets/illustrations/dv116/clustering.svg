<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Clustering iteration</title><desc id="desc">Points are assigned to cluster representatives, representatives are updated, and the process repeats.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Clustering alternates assignment and representative updates</text><circle cx="190" cy="230" r="12" fill="#2446a8"/><circle cx="240" cy="290" r="12" fill="#2446a8"/><circle cx="300" cy="210" r="12" fill="#2446a8"/><circle cx="750" cy="220" r="12" fill="#b85c18"/><circle cx="820" cy="280" r="12" fill="#b85c18"/><circle cx="900" cy="190" r="12" fill="#b85c18"/><circle cx="250" cy="245" r="24" fill="none" stroke="#2446a8" stroke-width="5"/><circle cx="825" cy="235" r="24" fill="none" stroke="#b85c18" stroke-width="5"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="360" y1="350" x2="520" y2="350" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="535" y="300" width="210" height="100" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="640.0" y="336" text-anchor="middle" class="lab">Update centres</text><text x="640.0" y="365" text-anchor="middle" class="sm">then reassign</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="760" y1="350" x2="920" y2="350" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><text x="70" y="500" class="sm">Convergence means assignments/centres stop changing materially—not that the clustering is automatically meaningful.</text></svg>