<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Linear regression</title><desc id="desc">Observed points are approximated by a fitted line and residuals show the vertical prediction errors.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Linear regression: fit a line, then inspect residuals</text><line x1="100" y1="470" x2="1120" y2="470" stroke="#172033" stroke-width="3"/><line x1="100" y1="470" x2="100" y2="120" stroke="#172033" stroke-width="3"/><circle cx="170" cy="410" r="10" fill="#b85c18"/><circle cx="270" cy="360" r="10" fill="#b85c18"/><circle cx="370" cy="340" r="10" fill="#b85c18"/><circle cx="470" cy="280" r="10" fill="#b85c18"/><circle cx="580" cy="300" r="10" fill="#b85c18"/><circle cx="700" cy="220" r="10" fill="#b85c18"/><circle cx="820" cy="190" r="10" fill="#b85c18"/><circle cx="970" cy="150" r="10" fill="#b85c18"/><line x1="140" y1="430" x2="1030" y2="135" stroke="#2446a8" stroke-width="5"/><line x1="270" y1="360" x2="270" y2="386.9" stroke="#a73535" stroke-width="3" stroke-dasharray="6 5"/><line x1="470" y1="280" x2="470" y2="320.6" stroke="#a73535" stroke-width="3" stroke-dasharray="6 5"/><line x1="700" y1="220" x2="700" y2="244.4" stroke="#a73535" stroke-width="3" stroke-dasharray="6 5"/><text x="720" y="525" class="sm">Residual = observed value − fitted value</text></svg>