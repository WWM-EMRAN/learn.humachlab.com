<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Feature scaling</title><desc id="desc">The same relative pattern is represented on a different numerical scale.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Scaling changes units while preserving relative structure</text><line x1="100" y1="360" x2="460" y2="360" stroke="#172033" stroke-width="3"/><line x1="100" y1="360" x2="100" y2="150" stroke="#172033" stroke-width="3"/><circle cx="150" cy="330" r="10" fill="#b85c18"/><circle cx="210" cy="300" r="10" fill="#b85c18"/><circle cx="290" cy="245" r="10" fill="#b85c18"/><circle cx="370" cy="190" r="10" fill="#b85c18"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="500" y1="260" x2="660" y2="260" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><line x1="730" y1="360" x2="1090" y2="360" stroke="#172033" stroke-width="3"/><line x1="730" y1="360" x2="730" y2="150" stroke="#172033" stroke-width="3"/><circle cx="790" cy="330" r="10" fill="#2446a8"/><circle cx="850" cy="300" r="10" fill="#2446a8"/><circle cx="930" cy="245" r="10" fill="#2446a8"/><circle cx="1010" cy="190" r="10" fill="#2446a8"/><text x="110" y="410" class="sm">Original units</text><text x="740" y="410" class="sm">Standardised / normalised units</text></svg>