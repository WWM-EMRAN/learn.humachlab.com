<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Python execution model</title><desc id="desc">Source code is executed by an interpreter or notebook kernel, changing runtime state and producing output or an error.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Code execution and runtime state</text><rect x="70" y="150" width="220" height="110" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="180.0" y="186" text-anchor="middle" class="lab">Source code</text><text x="180.0" y="215" text-anchor="middle" class="sm">statement / cell</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="300" y1="205" x2="390" y2="205" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="400" y="150" width="220" height="110" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="510.0" y="186" text-anchor="middle" class="lab">Interpreter</text><text x="510.0" y="215" text-anchor="middle" class="sm">parse + execute</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="630" y1="205" x2="720" y2="205" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="730" y="150" width="200" height="110" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="830.0" y="186" text-anchor="middle" class="lab">Runtime state</text><text x="830.0" y="215" text-anchor="middle" class="sm">names → objects</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="940" y1="205" x2="1030" y2="205" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="1040" y="150" width="100" height="110" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="1090.0" y="186" text-anchor="middle" class="lab">Output</text><text x="1090.0" y="215" text-anchor="middle" class="sm">or error</text><rect x="400" y="360" width="220" height="100" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="510.0" y="396" text-anchor="middle" class="lab">Notebook kernel</text><text x="510.0" y="425" text-anchor="middle" class="sm">state persists</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="510" y1="350" x2="510" y2="275" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><text x="70" y="515" class="sm">Restarting the interpreter/kernel clears ordinary in-memory state; rerunning code reconstructs it.</text></svg>