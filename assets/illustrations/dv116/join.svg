<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Table join</title><desc id="desc">Two tables are matched by a key; inner and left joins differ in which unmatched rows are retained.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Join logic: keys determine which rows survive</text><rect x="80" y="150" width="300" height="280" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="230.0" y="186" text-anchor="middle" class="lab">Orders</text><text x="230.0" y="215" text-anchor="middle" class="sm">customer_id + amount</text><rect x="820" y="150" width="300" height="280" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="970.0" y="186" text-anchor="middle" class="lab">Customers</text><text x="970.0" y="215" text-anchor="middle" class="sm">customer_id + segment</text><text x="150" y="245" class="s" transform="translate(0,0)">1  120</text><text x="150" y="245" class="s" transform="translate(0,55)">2   90</text><text x="150" y="245" class="s" transform="translate(0,110)">4  150</text><text x="885" y="245" class="s" transform="translate(0,0)">1  Retail</text><text x="885" y="245" class="s" transform="translate(0,55)">2  Business</text><text x="885" y="245" class="s" transform="translate(0,110)">3  Retail</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="390" y1="290" x2="560" y2="290" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="810" y1="290" x2="650" y2="290" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="510" y="210" width="180" height="160" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="600.0" y="246" text-anchor="middle" class="lab">JOIN</text><text x="600.0" y="275" text-anchor="middle" class="sm">match key values</text><text x="80" y="510" class="sm">INNER JOIN keeps matched keys; LEFT JOIN keeps every left-row and fills unmatched right-side fields with missing values.</text></svg>