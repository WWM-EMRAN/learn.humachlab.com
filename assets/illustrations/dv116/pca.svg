<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Principal component analysis</title><desc id="desc">PCA finds orthogonal directions of high variance and projects the observations onto them.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">PCA rotates the coordinate system toward maximum variance</text><line x1="170" y1="470" x2="1040" y2="170" stroke="#2446a8" stroke-width="5"/><line x1="250" y1="150" x2="890" y2="510" stroke="#087f8c" stroke-width="4" stroke-dasharray="8 6"/><circle cx="250" cy="430" r="10" fill="#b85c18"/><circle cx="330" cy="390" r="10" fill="#b85c18"/><circle cx="410" cy="370" r="10" fill="#b85c18"/><circle cx="500" cy="315" r="10" fill="#b85c18"/><circle cx="590" cy="300" r="10" fill="#b85c18"/><circle cx="680" cy="250" r="10" fill="#b85c18"/><circle cx="770" cy="235" r="10" fill="#b85c18"/><circle cx="860" cy="200" r="10" fill="#b85c18"/><circle cx="940" cy="180" r="10" fill="#b85c18"/><text x="840" y="150" class="lab">PC1</text><text x="860" y="520" class="lab">PC2</text><text x="70" y="540" class="sm">Projection onto the leading component preserves as much variance as possible for the chosen dimension.</text></svg>