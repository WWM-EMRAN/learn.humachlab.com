<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Decision tree</title><desc id="desc">A root split sends examples down left or right branches until they reach prediction leaves.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Decision tree: each split partitions the data</text><rect x="470" y="120" width="260" height="90" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="600.0" y="156" text-anchor="middle" class="lab">Is feature ≤ threshold?</text><text x="600.0" y="185" text-anchor="middle" class="sm">root split</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="520" y1="215" x2="330" y2="320" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="680" y1="215" x2="865" y2="320" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="210" y="330" width="260" height="90" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="340.0" y="366" text-anchor="middle" class="lab">Left branch</text><text x="340.0" y="395" text-anchor="middle" class="sm">condition true</text><rect x="740" y="330" width="260" height="90" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="870.0" y="366" text-anchor="middle" class="lab">Right branch</text><text x="870.0" y="395" text-anchor="middle" class="sm">condition false</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="300" y1="425" x2="220" y2="500" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="390" y1="425" x2="470" y2="500" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="830" y1="425" x2="760" y2="500" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="920" y1="425" x2="1000" y2="500" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><text x="110" y="555" class="sm">Leaves contain a prediction based on the training examples that reach them.</text></svg>