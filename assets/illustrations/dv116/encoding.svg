<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Categorical encoding</title><desc id="desc">Categories are converted to a numeric representation suitable for a model while preserving their intended semantics.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Categorical encoding changes representation, not meaning</text><rect x="80" y="180" width="250" height="190" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="205.0" y="216" text-anchor="middle" class="lab">Category</text><text x="205.0" y="245" text-anchor="middle" class="sm">red / blue / green</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="345" y1="275" x2="500" y2="275" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="515" y="160" width="270" height="230" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="650.0" y="196" text-anchor="middle" class="lab">Encoder</text><text x="650.0" y="225" text-anchor="middle" class="sm">one-hot / ordinal</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="800" y1="275" x2="950" y2="275" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="965" y="180" width="155" height="190" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="1042.5" y="216" text-anchor="middle" class="lab">Numeric</text><text x="1042.5" y="245" text-anchor="middle" class="sm">model input</text><text x="70" y="500" class="sm">Choose an encoding whose numeric structure matches the category semantics; do not invent order where none exists.</text></svg>