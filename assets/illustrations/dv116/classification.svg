<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Classification threshold</title><desc id="desc">A model score or probability is compared with a threshold to produce a class decision.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Classification converts a score into a class decision</text><line x1="110" y1="450" x2="1090" y2="450" stroke="#172033" stroke-width="3"/><line x1="110" y1="450" x2="110" y2="130" stroke="#172033" stroke-width="3"/><path d="M 140 420 C 360 420 420 370 530 290 C 670 185 770 160 1050 160" fill="none" stroke="#2446a8" stroke-width="6"/><line x1="110" y1="290" x2="1090" y2="290" stroke="#a73535" stroke-width="3" stroke-dasharray="8 6"/><text x="950" y="275" class="sm">decision threshold</text><text x="145" y="500" class="sm">low score → class 0</text><text x="850" y="500" class="sm">high score → class 1</text></svg>