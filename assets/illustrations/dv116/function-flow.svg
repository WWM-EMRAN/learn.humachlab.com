<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Function execution</title><desc id="desc">Arguments enter a reusable function, local logic transforms them, and a return value goes back to the caller.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Reusable function: input → transformation → return value</text><rect x="80" y="190" width="230" height="120" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="195.0" y="226" text-anchor="middle" class="lab">Arguments</text><text x="195.0" y="255" text-anchor="middle" class="sm">input objects</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="320" y1="250" x2="455" y2="250" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="465" y="165" width="270" height="170" rx="16" fill="#eef4ff" stroke="#2446a8" stroke-width="2"/><text x="600.0" y="201" text-anchor="middle" class="lab">Function body</text><text x="600.0" y="230" text-anchor="middle" class="sm">local names + logic</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="745" y1="250" x2="875" y2="250" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="885" y="190" width="230" height="120" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="1000.0" y="226" text-anchor="middle" class="lab">Return value</text><text x="1000.0" y="255" text-anchor="middle" class="sm">used by caller</text><path d="M 600 335 C 600 430 900 430 990 335" fill="none" stroke="#087f8c" stroke-width="4" stroke-dasharray="8 8"/><text x="760" y="455" class="sm">Side effects should be deliberate and visible.</text></svg>