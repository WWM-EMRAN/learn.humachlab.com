<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Time-series validation</title><desc id="desc">Training observations precede validation observations in time, preserving the forecasting direction.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Time-series validation preserves temporal order</text><rect x="80" y="250" width="82" height="80" rx="8" fill="#e9f4ee" stroke="#c8d1df"/><rect x="180" y="250" width="82" height="80" rx="8" fill="#e9f4ee" stroke="#c8d1df"/><rect x="280" y="250" width="82" height="80" rx="8" fill="#e9f4ee" stroke="#c8d1df"/><rect x="380" y="250" width="82" height="80" rx="8" fill="#e9f4ee" stroke="#c8d1df"/><rect x="480" y="250" width="82" height="80" rx="8" fill="#e9f4ee" stroke="#c8d1df"/><rect x="580" y="250" width="82" height="80" rx="8" fill="#e9f4ee" stroke="#c8d1df"/><rect x="680" y="250" width="82" height="80" rx="8" fill="#fdebea" stroke="#c8d1df"/><rect x="780" y="250" width="82" height="80" rx="8" fill="#fdebea" stroke="#c8d1df"/><rect x="880" y="250" width="82" height="80" rx="8" fill="#eef4ff" stroke="#c8d1df"/><rect x="980" y="250" width="82" height="80" rx="8" fill="#eef4ff" stroke="#c8d1df"/><text x="150" y="380" class="sm">past / training</text><text x="690" y="380" class="sm">validation</text><text x="900" y="380" class="sm">future</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="120" y1="180" x2="1040" y2="180" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><text x="530" y="155" class="sm">time →</text><text x="70" y="500" class="sm">Random shuffling can leak future information backward; rolling or expanding splits respect chronology.</text></svg>