<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Machine-learning pipeline</title><desc id="desc">A leakage-safe pipeline learns preprocessing and model parameters on training data and reuses them for new data.</desc>
<rect width="1200" height="600" rx="28" fill="#ffffff"/>
<rect x="18" y="18" width="1164" height="564" rx="22" fill="#f5f7fb" stroke="#c8d1df" stroke-width="2"/>
<style>text{font-family:Times New Roman, Times, serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:22px}.sm{font-size:18px;fill:#5f6b7a}.lab{font-size:20px;font-weight:700}</style>
<text x="70" y="80" class="h">Leakage-safe data pipeline</text><rect x="55" y="200" width="180" height="110" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="145.0" y="236" text-anchor="middle" class="lab">Raw training data</text><text x="145.0" y="265" text-anchor="middle" class="sm">fit only here</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="240" y1="255" x2="270" y2="255" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="280" y="200" width="180" height="110" rx="16" fill="#ffffff" stroke="#2446a8" stroke-width="2"/><text x="370.0" y="236" text-anchor="middle" class="lab">Preprocessing</text><text x="370.0" y="265" text-anchor="middle" class="sm">learn parameters</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="465" y1="255" x2="495" y2="255" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="505" y="200" width="180" height="110" rx="16" fill="#ffffff" stroke="#2446a8" stroke-width="2"/><text x="595.0" y="236" text-anchor="middle" class="lab">Model fit</text><text x="595.0" y="265" text-anchor="middle" class="sm">learn coefficients</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="690" y1="255" x2="720" y2="255" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="730" y="200" width="180" height="110" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="820.0" y="236" text-anchor="middle" class="lab">New data</text><text x="820.0" y="265" text-anchor="middle" class="sm">same transforms</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2446a8"/></marker></defs><line x1="915" y1="255" x2="945" y2="255" stroke="#2446a8" stroke-width="4" marker-end="url(#a)"/><rect x="955" y="200" width="180" height="110" rx="16" fill="#ffffff" stroke="#c8d1df" stroke-width="2"/><text x="1045.0" y="236" text-anchor="middle" class="lab">Prediction</text><text x="1045.0" y="265" text-anchor="middle" class="sm">no refitting</text><text x="70" y="430" class="sm">The important boundary is between learning parameters from training data and applying those saved parameters later.</text></svg>